[package]
name = "lob"
version = "0.1.0"
edition = "2021"
description = "A price-time priority limit order book and matching engine with deterministic replay"
license = "MIT"

[dependencies]
crc32fast = "1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
hdrhistogram = { version = "7.6", default-features = false }
thiserror = "2"

# Tests replay hundreds of thousands of commands with O(book) checks after each one;
# unoptimized builds made that ~30 s. Level 1 keeps debug info and overflow checks.
[profile.dev]
opt-level = 1

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }

# Release code plus debug info, so `perf report` can name functions and inlined frames (D29).
# `cargo build --profile profiling`; the release profile itself stays unchanged.
[profile.profiling]
inherits = "release"
debug = true

[[bench]]
name = "book"
harness = false
